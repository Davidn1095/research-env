name: Build atlas container c (atlas-2026.10b + rpy2, anndata2ri)

# Builds Dockerfile.atlas-c (atlas-2026.10b by digest + rpy2, anndata2ri), runs its load test and pushes ONLY the atlas tag
# (never :latest, which belongs to the general research-env image).
on:
  push:
    branches: [main]
    paths:
      - Dockerfile.atlas-c
      - Dockerfile.atlas-c.dockerignore
      - tests/atlas_c_load_test.py
      - .github/workflows/build-atlas-c.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: davidn1095/research-env
  TAG: atlas-2026.10c

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -f Dockerfile.atlas-c -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} .

      - name: Load test (rpy2 R calls, base unchanged)
        run: docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} python /opt/atlas-tests/atlas_c_load_test.py

      - name: Push image (only after the load test passes)
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Image size
        run: docker image ls ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
